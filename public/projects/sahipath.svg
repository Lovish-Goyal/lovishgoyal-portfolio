<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Gradients and Filters -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0F2E3A"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <dropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06B6D4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern in background -->
  <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150 M 0,200 L 800,200 M 0,250 L 800,250 M 0,300 L 800,300 M 0,350 L 800,350 M 0,400 L 800,400" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <path d="M 100,0 L 100,450 M 200,0 L 200,450 M 300,0 L 300,450 M 400,0 L 400,450 M 500,0 L 500,450 M 600,0 L 600,450 M 700,0 L 700,450" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Decorative Abstract Opportunity Network Graphics -->
  <g opacity="0.6">
    <circle cx="580" cy="180" r="80" stroke="url(#accentGrad)" stroke-width="1" stroke-dasharray="4, 8"/>
    <circle cx="580" cy="180" r="120" stroke="url(#accentGrad)" stroke-width="1" stroke-dasharray="10, 20" opacity="0.5"/>
    <circle cx="580" cy="180" r="160" stroke="url(#accentGrad)" stroke-width="0.5" opacity="0.3"/>
    
    <!-- Nodes -->
    <circle cx="580" cy="180" r="14" fill="url(#accentGrad)" filter="url(#glow)"/>
    <circle cx="500" cy="140" r="8" fill="#06B6D4"/>
    <circle cx="660" cy="130" r="10" fill="#10B981"/>
    <circle cx="640" cy="240" r="7" fill="#06B6D4"/>
    <circle cx="500" cy="220" r="9" fill="#10B981"/>
    
    <!-- Connection lines -->
    <line x1="580" y1="180" x2="500" y2="140" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="580" y1="180" x2="660" y2="130" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="580" y1="180" x2="640" y2="240" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="580" y1="180" x2="500" y2="220" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>

  <!-- Content Group -->
  <g transform="translate(60, 80)">
    <!-- Logo Badge -->
    <rect width="60" height="60" rx="16" fill="url(#accentGrad)" opacity="0.2"/>
    <path d="M 22 42 L 30 18 L 38 42 M 25 34 L 35 34" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Title -->
    <text x="0" y="100" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="44" letter-spacing="-1">SahiPath</text>
    
    <!-- Tagline -->
    <text x="0" y="135" fill="#E2E8F0" font-family="'Inter', sans-serif" font-weight="600" font-size="18" opacity="0.9">Tech Opportunity Platform</text>
    
    <!-- Description -->
    <text x="0" y="175" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="14" font-weight="500">
      <tspan x="0" dy="0">Discover internships, hackathons, and technical events</tspan>
      <tspan x="0" dy="20">in one high-performance dashboard. Implements clean</tspan>
      <tspan x="0" dy="20">Flutter architecture, offline support &amp; smart caching.</tspan>
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 240)">
      <!-- Badge 1 -->
      <rect width="90" height="30" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="45" y="19" fill="#06B6D4" font-family="'Inter', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Flutter SDK</text>

      <!-- Badge 2 -->
      <rect x="100" width="75" height="30" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="137.5" y="19" fill="#10B981" font-family="'Inter', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Dart Lang</text>

      <!-- Badge 3 -->
      <rect x="185" width="105" height="30" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="237.5" y="19" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">REST APIs</text>
      
      <!-- Badge 4 -->
      <rect x="300" width="100" height="30" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="350" y="19" fill="#F59E0B" font-family="'Inter', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Google AdMob</text>
    </g>
  </g>
</svg>
