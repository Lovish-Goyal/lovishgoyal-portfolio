<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Gradients and Filters -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0E3A3E"/>
      <stop offset="100%" stop-color="#0A5C5A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <dropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0D9488" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern in background -->
  <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150 M 0,200 L 800,200 M 0,250 L 800,250 M 0,300 L 800,300 M 0,350 L 800,350 M 0,400 L 800,400" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <path d="M 100,0 L 100,450 M 200,0 L 200,450 M 300,0 L 300,450 M 400,0 L 400,450 M 500,0 L 500,450 M 600,0 L 600,450 M 700,0 L 700,450" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Camera Scanner Scanline & Face Mesh outline representation -->
  <g opacity="0.8">
    <!-- Camera scanner circle target -->
    <circle cx="580" cy="200" r="75" stroke="url(#accentGrad)" stroke-width="2" filter="url(#glow)"/>
    <circle cx="580" cy="200" r="10" fill="#0D9488"/>
    
    <!-- Facial Target corners -->
    <path d="M 480 140 L 480 120 L 500 120" stroke="#14B8A6" stroke-width="3" stroke-linecap="round"/>
    <path d="M 680 140 L 680 120 L 660 120" stroke="#14B8A6" stroke-width="3" stroke-linecap="round"/>
    <path d="M 480 260 L 480 280 L 500 280" stroke="#14B8A6" stroke-width="3" stroke-linecap="round"/>
    <path d="M 680 260 L 680 280 L 660 280" stroke="#14B8A6" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Moving Laser scanline -->
    <line x1="470" y1="200" x2="690" y2="200" stroke="#14B8A6" stroke-width="2" stroke-opacity="0.8" filter="url(#glow)"/>
    
    <!-- DB Logs boxes -->
    <rect x="530" y="295" width="100" height="25" rx="6" fill="#0D9488" opacity="0.2" stroke="#0D9488" stroke-dasharray="2,2"/>
    <text x="580" y="311" fill="#14B8A6" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">AUTHORIZED LOG</text>
  </g>

  <!-- Content Group -->
  <g transform="translate(60, 80)">
    <!-- Logo Badge -->
    <rect width="60" height="60" rx="16" fill="url(#accentGrad)" opacity="0.2"/>
    <!-- Scan badge icon -->
    <rect x="20" y="20" width="20" height="20" rx="2" stroke="url(#accentGrad)" stroke-width="3" fill="none"/>
    <circle cx="30" cy="30" r="3" fill="url(#accentGrad)"/>
    
    <!-- Title -->
    <text x="0" y="100" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="38" letter-spacing="-1">Smart Attendance</text>
    
    <!-- Tagline -->
    <text x="0" y="135" fill="#E2E8F0" font-family="'Inter', sans-serif" font-weight="600" font-size="18" opacity="0.9">AI Computer Vision Tracker</text>
    
    <!-- Description -->
    <text x="0" y="94A3B8" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="14" font-weight="500">
      <tspan x="0" dy="175">Automated attendance logging system utilizing facial</tspan>
      <tspan x="0" dy="20">recognition models. Automatically logs scanned user profiles</tspan>
      <tspan x="0" dy="20">into a local MySQL database via a Python/Flask API.</tspan>
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 240)">
      <!-- Badge 1 -->
      <rect width="65" height="30" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="32.5" y="19" fill="#0D9488" font-family="'Inter', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Python</text>

      <!-- Badge 2 -->
      <rect x="75" width="70" height="30" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="110" y="19" fill="#14B8A6" font-family="'Inter', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">OpenCV</text>

      <!-- Badge 3 -->
      <rect x="155" width="75" height="30" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="192.5" y="19" fill="#5EEAD4" font-family="'Inter', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">MySQL</text>
      
      <!-- Badge 4 -->
      <rect x="240" width="75" height="30" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="277.5" y="19" fill="#0F766E" font-family="'Inter', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Flask API</text>
    </g>
  </g>
</svg>
